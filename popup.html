<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 240px;
      padding: 16px;
      margin: 0;
      color: #1f1f1f;
      text-align: center;
    }
    h3 { margin: 0 0 12px; font-size: 15px; }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .start { background: #1a73e8; color: #fff; }
    .start:hover { background: #1557b0; }
    .stop { background: #d93025; color: #fff; }
    .stop:hover { background: #b3261e; }
    #status { font-size: 12px; margin-top: 10px; color: #5f6368; }
  </style>
</head>
<body>
  <h3>Continuous Prompter</h3>
  <button id="toggleBtn" class="start">Start Looping</button>
  <div id="status">Status: Idle</div>
  <script src="popup.js"></script>
</body>
</html>
